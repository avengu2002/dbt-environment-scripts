version: 2
sources:
  - name: snowflake_data
    database: "{{('sales')}}"
    schema: raw
    tables:
      - name: RAW_LINEITEM
        columns:
          - name: l_orderkey
            tests:
              - not_null
          - name: l_quantity
            tests:
              - not_null
          - name: l_linenumber
            tests:
              - not_null
      - name: RAW_NATION
        columns:
          - name: n_nationkey
            tests:
              - unique
              - not_null
          - name: n_name
            tests:
              - not_null
      - name: RAW_ORDER
        columns:
          - name: o_orderkey
            tests:
              - unique
              - not_null

      - name: RAW_CUSTOMER
        columns:
          - name: c_custkey
            tests:
              - unique
              - not_null
          - name: c_name
            tests:
              - not_null
      - name: RAW_SUPPLIER
      - name: RAW_PARTSUPP
      - name: RAW_PART
      - name: RAW_REGION
      - name: RAW_CUSTOMER_NATION

  - name: snapshot_tables
    database: "{{('sales')}}"
    schema: snapshot_schema
    tables:
      - name: snap_ordersdetails
models:
  - name: STG_CUSTOMER
    description: "A staging customers dbt model"
    columns:
      - name: customer_key
        description: "The primary key for this table"
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Customer name field for this table"
        tests:
          - not_null
